<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0b10">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glass Drift">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Stained Glass Drift</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="stage" aria-label="Artwork">
    <canvas id="art" aria-label="Generated stained glass artwork"></canvas>
    <div id="veil" aria-hidden="true"></div>
  </main>

  <header id="topbar" role="banner">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Stained Glass Drift</span>
    </div>
    <div class="top-right">
      <button class="pill" id="seedPill" title="Tap to copy seed" aria-label="Current seed">seed &mdash;</button>
      <button class="ico" id="settingsBtn" aria-label="Open settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm9.1 3.5c0-.5-.05-1-.12-1.48l2.02-1.58a.55.55 0 0 0 .13-.7l-1.92-3.32a.55.55 0 0 0-.67-.24l-2.38.96a7.4 7.4 0 0 0-2.56-1.49l-.36-2.54a.55.55 0 0 0-.54-.47h-3.84a.55.55 0 0 0-.54.47l-.36 2.54a7.4 7.4 0 0 0-2.56 1.5L5.03 4.68a.55.55 0 0 0-.67.24L2.44 8.24c-.16.27-.1.61.13.8l2.02 1.58A7.1 7.1 0 0 0 4.47 12c0 .5.04 1 .12 1.48L2.57 15.06a.55.55 0 0 0-.13.7l1.92 3.32c.14.25.44.35.67.24l2.38-.96a7.4 7.4 0 0 0 2.56 1.49l.36 2.54c.05.28.28.47.54.47h3.84c.27 0 .5-.2.54-.47l.36-2.54a7.4 7.4 0 0 0 2.56-1.5l2.38.97c.23.1.53 0 .67-.24l1.92-3.32a.55.55 0 0 0-.13-.7l-2.02-1.58c.08-.48.12-.98.12-1.48Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <nav id="controls" role="toolbar" aria-label="Artwork controls">
    <button class="btn primary" id="newBtn" aria-label="Generate new artwork">
      <span class="ic" aria-hidden="true">✦</span><span class="lbl">New</span>
    </button>
    <button class="btn" id="paletteBtn" aria-label="Shuffle palette">
      <span class="ic" aria-hidden="true">◉</span><span class="lbl">Palette</span>
    </button>
    <button class="btn" id="surpriseBtn" aria-label="Surprise me">
      <span class="ic" aria-hidden="true">❍</span><span class="lbl">Surprise</span>
    </button>
    <button class="btn" id="favBtn" aria-label="Favorite this artwork" aria-pressed="false">
      <span class="ic heart" aria-hidden="true">♡</span><span class="lbl">Favorite</span>
    </button>
    <button class="btn" id="saveBtn" aria-label="Save image">
      <span class="ic" aria-hidden="true">⤓</span><span class="lbl">Save</span>
    </button>
    <button class="btn" id="galleryBtn" aria-label="View favorites">
      <span class="ic" aria-hidden="true">✧</span><span class="lbl">Favorites</span>
    </button>
  </nav>

  <section id="settingsPanel" class="panel" hidden aria-hidden="true" aria-labelledby="settingsTitle">
    <div class="panel-head">
      <h2 id="settingsTitle">Composition</h2>
      <button class="ico close" data-close="settingsPanel" aria-label="Close settings">×</button>
    </div>
    <div class="panel-body">
      <label class="slider">
        <span class="row"><span>Complexity</span><output id="complexityOut">120</output></span>
        <input type="range" id="complexity" min="40" max="260" value="120" step="1">
      </label>
      <label class="slider">
        <span class="row"><span>Glow</span><output id="glowOut">60</output></span>
        <input type="range" id="glow" min="0" max="100" value="60" step="1">
      </label>
      <label class="slider">
        <span class="row"><span>Distortion</span><output id="distortionOut">35</output></span>
        <input type="range" id="distortion" min="0" max="100" value="35" step="1">
      </label>
      <label class="slider">
        <span class="row"><span>Lead Thickness</span><output id="leadOut">55</output></span>
        <input type="range" id="lead" min="0" max="100" value="55" step="1">
      </label>
      <label class="slider">
        <span class="row"><span>Transparency</span><output id="transparencyOut">62</output></span>
        <input type="range" id="transparency" min="20" max="95" value="62" step="1">
      </label>
      <div class="palette-row" id="paletteRow" role="listbox" aria-label="Palette"></div>
      <div class="shimmer-row">
        <label class="check"><input type="checkbox" id="shimmer"><span>Gentle shimmer</span></label>
      </div>
    </div>
  </section>

  <section id="galleryPanel" class="panel full" hidden aria-hidden="true" aria-labelledby="galleryTitle">
    <div class="panel-head">
      <h2 id="galleryTitle">Favorites</h2>
      <button class="ico close" data-close="galleryPanel" aria-label="Close favorites">×</button>
    </div>
    <div class="panel-body">
      <div id="galleryGrid" class="gallery" role="list"></div>
      <p class="empty-msg" id="emptyMsg" hidden>No favorites yet. Tap ♡ on a piece you love.</p>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
